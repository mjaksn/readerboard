# Home Assistant automation that keeps the outdoor temperature on the sign.
#
# What changed for the rewrite, and why:
#
#   - The one second delay before the call and the four second delay after it
#     are gone. They existed because the old server opened the serial port,
#     wrote, slept two seconds and closed it on every request, so two calls
#     arriving together fought over the device. The service now funnels every
#     write through a single writer and there is nothing left to space out.
#
#   - "mode: queued" with "max: 4" is gone for the same reason. Serialising the
#     calls was the automation doing the server's job for it.
#
#   - The mains power outage trigger is kept, but it no longer has to carry the
#     clock. The service sets the sign's clock whenever the link to it comes
#     back, which is a better signal for "the sign may have just lost power"
#     than any schedule.
#
# Re-sending an unchanged temperature is now free: the service notices the bytes
# match what the sign already holds and does not write, so the display no longer
# flickers on every Home Assistant restart.

alias: Update outdoor temperature on Betabrite sign
description: ''
triggers:
  - trigger: time_pattern
    minutes: '02'
    hours: /2
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
      - binary_sensor.mains_power_outage
    to: 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    from: null
  - trigger: state
    entity_id:
      - sensor.average_outdoor_temperature
conditions: []
actions:
  - action: rest_command.update_readerboard_temperature
    metadata: {}
    data:
      temperature: '{{ states(''sensor.average_outdoor_temperature'') }}'
mode: single
