# Home Assistant automation that keeps the outdoor temperature on the sign.
#
# Two things this automation deliberately does not do.
#
#   - No delays around the call, and no "mode: queued". The service funnels
#     every write through a single writer that owns the serial link, so
#     concurrent calls are already made to take turns. Spacing them out here
#     would be the automation doing the service's job for it.
#
#   - Nothing about the sign's clock. The service sets it whenever the link
#     comes back, which is a better signal for "the sign may have just lost
#     power" than any schedule an automation could run.
#
# Re-sending an unchanged temperature costs nothing: the service notices the
# bytes match what the sign already holds and does not write, so the display
# does not flicker on every Home Assistant restart.

alias: Update outdoor temperature on Betabrite sign
description: ''
triggers:
  - trigger: time_pattern
    minutes: '02'
    hours: /2
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
      - binary_sensor.mains_power_outage
    to: 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    from: null
  - trigger: state
    entity_id:
      - sensor.average_outdoor_temperature
conditions: []
actions:
  - action: rest_command.update_readerboard_temperature
    metadata: {}
    data:
      temperature: '{{ states(''sensor.average_outdoor_temperature'') }}'
mode: single
