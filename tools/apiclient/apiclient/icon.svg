<?xml version="1.0" encoding="UTF-8"?>
<!--
  The client's icon.

  A paper plane on a blue tile, for the tool whose whole job is sending things
  to the service. It is deliberately nothing like the simulator's icon, which is
  the sign itself in amber on black: the two are meant to be told apart at a
  glance on a taskbar, and colour and shape together do that where a detail
  inside the same shape would not. The three dots trailing the plane are the
  one nod to the dot matrix on the other icon.

  scripts/render_icons.py turns this into the icon.ico beside it. Edit this,
  run that, commit both.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="3" y="3" width="58" height="58" rx="13" fill="#2b6fd6"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#174a9c" stroke-width="1.5"/>
  <g fill="#8fbaf5">
    <circle cx="14" cy="45" r="1.9"/>
    <circle cx="20" cy="41" r="1.9"/>
    <circle cx="26" cy="37" r="1.9"/>
  </g>
  <polygon points="12,30 55,11 32,38" fill="#ffffff"/>
  <polygon points="32,38 55,11 40,53" fill="#d5e5fb"/>
  <polygon points="32,38 30,49 36,44" fill="#b9d3f5"/>
</svg>
