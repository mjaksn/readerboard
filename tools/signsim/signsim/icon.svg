<?xml version="1.0" encoding="UTF-8"?>
<!--
  The sign simulator's icon.

  The sign itself, which is what the simulator stands in for: a dark housing
  and a bezel around an 11 by 7 grid of dots on a 4.5 unit pitch, the lit ones
  amber with a faint glow behind each and the rest a dim warm grey, which is
  what a BetaBrite looks like with the room lights on. It is showing a message,
  because that is what a sign does and what the simulator shows you.

  The client's icon is deliberately nothing like this one, a paper plane on a
  blue tile, so that the two are told apart at a glance on a taskbar.

  scripts/render_icons.py turns this into the icon.ico beside it. Edit this,
  run that, commit both.
-->
