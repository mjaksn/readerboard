# CodeQL static analysis.
#
# This project is Python only, so there is no build step: CodeQL reads the
# source directly. The template's autobuild step, which exists for compiled
# languages, has been removed rather than left in to do nothing.

name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly, on Tuesday evening, so a new advisory is picked up without waiting
    # for the next push to a repository that can go quiet for months.
    - cron: '44 21 * * 2'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
