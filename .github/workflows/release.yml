name: Release

# Tags only. Nothing here fires on a branch, so publishing is always a
# deliberate act with a version number attached to it.
#
# Publishing goes through a trusted publisher registered on PyPI: a GitHub
# publisher naming this repository, this workflow file, and the environment
# below. It exchanges a short-lived OIDC token at publish time, so there is no
# API token living in the repository secrets to leak or to rotate.
#
# It goes in as a *pending* publisher, from the publishing page of the PyPI
# account, because there is no project to attach an ordinary one to until
# something has been uploaded and the first upload is the one that needs it.
# PyPI turns it into an ordinary publisher when that upload creates the project.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: the tag and the version must agree
        # A tag that disagrees with pyproject.toml, or with the package's own
        # __version__, publishes something nobody can find again. Cheaper to
        # fail here than to yank a release.
        #
        # __version__ is read out of the source tree rather than an installed
        # wheel: importing this package pulls in FastAPI and pyserial, and
        # installing those to read one string is a slow way to learn nothing.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          pkg_version="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("readerboard/__init__.py").read_text()).group(1))')"
          echo "tag $tag, pyproject $version, __version__ $pkg_version"
          [ "$tag" = "$version" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          }
          [ "$tag" = "$pkg_version" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match readerboard.__version__ $pkg_version"
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  docker:
    name: build and push the image
    needs: [build]
    runs-on: ubuntu-latest
    # Behind `build` for its version check rather than behind `publish`: the
    # image does not contain the distributions and has nothing to wait for them
    # for, so it goes out alongside the upload rather than after it. What it
    # does need is the guarantee that the tag, pyproject.toml and __version__
    # agree, and that is what `build` establishes.
    permissions:
      contents: read
      packages: write        # GHCR, through the token this job already has
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU is what makes the two arm legs possible on an x86 runner. They stay
      # quick only because every pinned dependency has a wheel for both, so
      # nothing is compiled under emulation. A dependency added without one
      # would show up here as a build that takes minutes rather than seconds.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: log in to GHCR
        # The workflow's own token, scoped by the `packages: write` above. No
        # secret to store and none to rotate, which is the same reasoning the
        # PyPI trusted publisher above rests on.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: work out the tags
        id: meta-ghcr
        # The version comes from the git tag, which `build` has
        # already checked against pyproject.toml and readerboard.__version__,
        # so the image is a fourth place the same number appears rather than an
        # independent opinion about it.
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
          # auto, not true: a prerelease tag such as v1.0.0-rc1 would
          # otherwise move `latest` onto it, and `latest` is what an
          # unqualified docker pull takes.
          flavor: latest=auto

      - name: build and push to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          provenance: true
          sbom: true

  docker-hub:
    name: mirror the image to Docker Hub
    needs: [build]
    runs-on: ubuntu-latest
    # A job of its own, and that is the point of it. Docker Hub is the one
    # registry here that needs a stored secret, so it is the one that can
    # fail for a reason nothing in this repository controls: a rotated
    # token, a fork without the secrets, an outage. None of that should
    # cost the GHCR image or the release page, and in a separate job it
    # cannot.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: work out the Docker Hub tags
        id: meta-hub
        # The same rules against the other registry, so the two can never
        # be tagged differently.
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
          flavor: latest=auto

      - name: log in to Docker Hub
        # Docker Hub has no equivalent of the exchange above, so this one is a
        # stored access token. Scope it to writing this repository and nothing
        # else.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: push to Docker Hub
        # The same build, from cache, retagged.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta-hub.outputs.tags }}
          labels: ${{ steps.meta-hub.outputs.labels }}
          provenance: true
          sbom: true

      - name: put the README on the Docker Hub page
        # Docker Hub's overview is not part of the image. It is a field on the
        # repository, and neither `docker push` nor the OCI labels above touch
        # it, so without this step the page stays blank however good the labels
        # are. GHCR needs no equivalent: it reads the description and the source
        # link straight off the image.
        #
        # Pushed from README.md rather than written on the site, so there is one
        # account of what this is and the page quotes it, the same arrangement
        # the release notes and CHANGELOG.md already have.
        #
        # This needs a token with write access to the repository. A read-only or
        # push-only one fails here, after the image has already gone out.
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository }}
          readme-filepath: ./README.md
          # The overview only. The short description is deliberately left alone:
          # Docker Hub caps it at 100 characters and the description this
          # project uses everywhere else is 130, so feeding it in would fail
          # this step every time, after the image had already gone out. The
          # short one is set on the site and changes about never.

  release:
    name: create the GitHub release
    # Behind the image as well as the upload. The notes lifted out of
    # CHANGELOG.md say the image is published on every release, so cutting
    # the release page while that job was failing would announce a pull
    # that answers "manifest unknown". GHCR only: the Docker Hub mirror is
    # a separate job precisely so its secret cannot hold up the release.
    needs: [publish, docker]
    runs-on: ubuntu-latest
    # The only job here that writes back to the repository, and the only one
    # with no use for the OIDC token the publish above exchanges. Kept apart so
    # that neither holds a permission the other needs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the notes come from the changelog
        # A release page written by hand would be a second account of a release
        # that CHANGELOG.md already gives, free to drift from it. The section
        # for the tag is lifted out instead, so there is one account and the
        # release page quotes it.
        #
        # A tag the changelog says nothing about fails here rather than
        # publishing an empty page, for the reason the version check above
        # fails: cheaper than editing a release after the fact.
        run: |
          python3 - <<'PY' > notes.md
          import os, pathlib, re, sys
          version = os.environ["GITHUB_REF_NAME"][1:]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          found = re.search(
              r"(?ms)^## \[%s\][^\n]*\n(.*?)(?=^## \[|^\[[0-9])"
              % re.escape(version),
              text)
          if found is None or not found.group(1).strip():
              raise SystemExit("CHANGELOG.md has no section for %s" % version)
          sys.stdout.write(found.group(1).strip() + "\n")
          PY
      - name: create the release
        # gh rather than an action, because the runner already has it and the
        # token it needs is the one the job was given. Nothing new to pin.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "readerboard ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
