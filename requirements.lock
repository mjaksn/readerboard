# Exact runtime pins for the machine that drives the sign.
#
# pyproject.toml carries compatible-release ranges, which is the right thing for
# anyone installing the package fresh. This file is what scripts/install.sh uses,
# so that the Pi gets the same versions twice running and an upstream release
# cannot change what is on the wall without someone deciding it should.
#
# Every version here was published more than fourteen days before it was pinned.
# The two markers below are the same ones uvicorn's own metadata carries: uvloop
# is not built for Windows, and colorama is only needed there.
#
# Development tools are not pinned here; they live in the "dev" extra.
#
# To refresh: install the "dev" extra into a clean virtual environment, check
# each candidate's release date, then update the versions below.

